[project]
name = "project-hub"
version = "0.1.0"
description = "Project management API"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Mila Halko" }]
keywords = ["fastapi", "project-management", "api"]
dependencies = [
    "fastapi>=0.162.4",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary] (>=3.2)",
    "sqlalchemy[asyncio] (>=2.1,<3)",
    "alembic (>=1.20,<2)",
    "psycopg-pool (>=3.3,<4)",
    "argon2-cffi (>=25.1,<26)",
    "pyjwt (>=2.15,<3)",
    "boto3 (>=1.44,<2)",
    "python-multipart (>=0.0.33,<0.1)",
    "email-validator (>=2.2,<3)",
]

[project.urls]
Repository = "https://github.com/MilaHalko/project-hub"

[project.scripts]
project-hub-migrate = "project_hub.db.migrate:main"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.2,<3.0"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs", "specs", ".superpowers", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra --strict-markers -m "not docker and not package and not lambda_package"'
markers = [
    "docker: builds and runs Docker images; opt-in with pytest -m docker",
    "package: builds the wheel and runs it from a clean venv; opt-in with pytest -m package",
    "lambda_package: builds the storage usage Lambda zip and runs it in the Lambda base image; opt-in with pytest -m lambda_package",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "boto3-stubs[s3,ses,sesv2] (>=1.44,<2)",
    "moto[ses] (>=5.1,<6)",
]
