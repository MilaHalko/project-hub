name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Component tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the stack
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          APP_JWT_SECRET=$secret docker compose -f docker-compose.yml -f frontend/compose.yml up -d --build --wait
      - name: Browser tests
        working-directory: frontend
        run: npx playwright test
      - name: Check the web log hides join tokens
        run: |
          log=$(docker compose -f docker-compose.yml -f frontend/compose.yml logs --no-color web)
          grep -q '"GET /api/join HTTP' <<<"$log" || { echo "::error::No GET /api/join in the web log"; exit 1; }
          if grep -q 'token=' <<<"$log"; then
            echo "::error::The web log contains a join token"
            exit 1
          fi
      - name: Show the stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f frontend/compose.yml logs --no-color
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f frontend/compose.yml down -v
