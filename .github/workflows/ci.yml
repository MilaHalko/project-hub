name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: project_hub
          POSTGRES_PASSWORD: project_hub
          POSTGRES_DB: project_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U project_hub -d project_hub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://project_hub:project_hub@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Check the interpreter is Python 3.13
        run: poetry run python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
      - name: Ruff check
        run: poetry run ruff check
      - name: Ruff format
        run: poetry run ruff format --check
      - name: Pyright
        run: poetry run pyright
      - name: Tests
        run: poetry run pytest -v 2>&1 | tee pytest.log
      - name: Check both database backends were tested
        run: poetry run python -m tests.support.backend_coverage pytest.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Docker smoke tests
        run: poetry run pytest -m docker -v
