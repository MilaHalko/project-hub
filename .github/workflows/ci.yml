name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: project_hub
          POSTGRES_PASSWORD: project_hub
          POSTGRES_DB: project_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U project_hub -d project_hub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      s3:
        image: motoserver/moto:5.2.5
        ports: ["5000:5000"]
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DATABASE_URL: postgresql://project_hub:project_hub@localhost:5432/postgres
      TEST_S3_ENDPOINT_URL: http://localhost:5000
      TEST_SMTP_PORT: "1025"
      TEST_MAILPIT_URL: http://localhost:8025
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: poetry
      - name: Check poetry.lock matches pyproject.toml
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Check the interpreter is Python 3.13
        run: poetry run python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
      - name: Ruff check
        run: poetry run ruff check
      - name: Ruff format
        run: poetry run ruff format --check
      - name: Pyright
        run: poetry run pyright
      - name: Tests
        run: poetry run pytest -v 2>&1 | tee pytest.log
      - name: Check both database backends were tested
        run: poetry run python -m tests.support.backend_coverage pytest.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Docker smoke tests
        run: poetry run pytest -m docker -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Poetry
        run: |
          pipx install poetry==2.5.1
          pipx inject poetry poetry-plugin-export==1.10.1
      - name: Export the locked dependencies
        run: poetry export --with dev --format requirements.txt --output requirements-audit.txt
      - name: pip-audit
        run: pipx run --spec pip-audit==2.10.1 pip-audit --require-hashes --disable-pip --requirement requirements-audit.txt
      - name: Build the API image
        run: docker build --tag project-hub-api:scan .
      - name: Trivy scan of the API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: project-hub-api:scan
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: project_hub
          POSTGRES_PASSWORD: project_hub
          POSTGRES_DB: project_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U project_hub -d project_hub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://project_hub:project_hub@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build the wheel and sdist
        run: poetry build --no-interaction
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-hub-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Package smoke tests
        env:
          PACKAGE_DIST_DIR: dist
        run: poetry run pytest -m package -v

  lambda:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: project_hub
          POSTGRES_PASSWORD: project_hub
          POSTGRES_DB: project_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U project_hub -d project_hub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      s3:
        image: motoserver/moto:5.2.5
        ports: ["5000:5000"]
    env:
      TEST_DATABASE_URL: postgresql://project_hub:project_hub@localhost:5432/postgres
      TEST_S3_ENDPOINT_URL: http://localhost:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build the storage usage Lambda zip
        run: bash scripts/build_storage_usage_lambda.sh
      - name: Upload the Lambda zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-usage-lambda
          path: dist/storage-usage-lambda.zip
          if-no-files-found: error
          retention-days: 14
      - name: Build the image preview Lambda zip
        run: bash scripts/build_image_preview_lambda.sh
      - name: Upload the image preview Lambda zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-preview-lambda
          path: dist/image-preview-lambda.zip
          if-no-files-found: error
          retention-days: 14
      - name: Lambda smoke test
        run: poetry run pytest -m lambda_package -v

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: Install checkov
        run: pipx install checkov==3.4.5
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra
      - name: Validate the persistent layer
        run: |
          terraform -chdir=infra/persistent init -backend=false -input=false
          terraform -chdir=infra/persistent validate
      - name: Validate the ephemeral layer
        run: |
          terraform -chdir=infra/ephemeral init -backend=false -input=false
          terraform -chdir=infra/ephemeral validate
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/infra/.tflint.hcl"
          tflint --recursive --config "$PWD/infra/.tflint.hcl" --chdir infra
      - name: checkov
        run: checkov -d infra --framework terraform --quiet --compact --skip-path '\.terraform'
      - name: Terraform tests
        run: terraform -chdir=infra/persistent test
