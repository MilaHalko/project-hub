map $request_uri $request_path {
    "~^(?<path>[^?]*)" $path;
}

map $http_referer $referer_path {
    "" "-";
    "~^(?<path>[^?]*)" $path;
}

log_format path_only '$remote_addr - $remote_user [$time_local] "$request_method $request_path $server_protocol" '
                     '$status $body_bytes_sent "$referer_path" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log path_only;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    include /etc/nginx/security-headers.conf;

    location ^~ /api/ {
        # A literal upstream is resolved once at startup and goes stale when the api container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://${API_UPSTREAM};
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api_upstream;
        client_max_body_size 11m;
        proxy_redirect http://${API_UPSTREAM}/ /api/;
    }

    location = /docs {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://${API_UPSTREAM};
        proxy_pass $api_upstream;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /openapi.json {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once on;
        sub_filter '"openapi":"3.1.0"' '"openapi":"3.1.0","servers":[{"url":"/api"}]';
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/join {
        # An upstream error line repeats the request line, and with it the join token.
        error_log /var/log/nginx/error.log crit;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://${API_UPSTREAM};
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api_upstream;
        proxy_redirect http://${API_UPSTREAM}/ /api/;
    }

    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ \.[^/]+$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
